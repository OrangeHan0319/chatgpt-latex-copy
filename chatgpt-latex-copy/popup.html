<!doctype html>
<html lang="zh-CN">
  <head>

    <title>公式复制设置</title>

      body { width: 220px; margin: 0; padding: 16px; color: #202123; font: 14px/1.45 system-ui, sans-serif; }
      h1 { margin: 0 0 10px; font-size: 16px; }
      label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
